# srcs/docker-compose.yml (lives next to .env)

services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    env_file: .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: always
    # Healthy only once the final server accepts connections (the first-run
    # setup happens before it starts). It logs in as the app user so the server
    # log isn't flooded with "Access denied" warnings; $$ leaves the variables
    # to be expanded inside the container, from its env_file.
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 30s

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    env_file: .env
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: always

  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    container_name: nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    restart: always

# Named volumes whose storage is a folder on the host (DATA_DIR comes from .env).
# The host folders must exist before "up": Docker does not create them.
volumes:
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:?set DATA_DIR in .env}/mariadb
  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:?set DATA_DIR in .env}/wordpress

networks:
  inception:
    name: inception
    driver: bridge
